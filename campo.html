<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1230">
<title>L'Anima del Palio</title>
<meta name="description" content="Siena, le sue 17 contrade, i loro amori e le loro rivalità. Un viaggio nell'anima del Palio.">
<style>
:root{
  --stone:#e9dcc3;--stone2:#d9c7a4;--ink:#2a1a14;--night:#1b1230;--dusk:#3a1f3d;--ember:#c8553d;
  --gold:#c9972b;--red:#a3231f;--blue:#1f4f8b;--paper:#f6ecd7;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:ui-rounded,"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--serif);line-height:1.6;font-size:18px;overflow-x:hidden}
a{color:var(--gold)}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;left:-9999px}
/* top bar */
header.bar{position:fixed;z-index:50;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:linear-gradient(#1b1230ee,#1b123000);pointer-events:none}
header.bar>*{pointer-events:auto}
.logo{font-family:var(--serif);letter-spacing:.14em;font-size:13px;text-transform:uppercase;color:var(--gold);text-decoration:none;background:none;border:0;padding:6px 0}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tools button{background:#ffffff14;border:1px solid #ffffff30;border-radius:99px;padding:5px 12px;font-family:var(--sans);font-size:13px;backdrop-filter:blur(6px)}
.tools button.on{background:var(--gold);color:#2a1a14;border-color:var(--gold)}
main{min-height:100vh}
section.page{display:none;animation:fade .7s ease both}
section.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  background:radial-gradient(120% 70% at 50% 100%,#e0803f 0%,#a8434a 22%,#5b2a58 48%,#2b1646 72%,#1b1230 100%);overflow:hidden;padding-top:56px}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.0;animation:tw 4s infinite}
@keyframes tw{50%{opacity:.9}}
.hero h1{margin:6px 16px 0;text-align:center;font-weight:400;font-size:clamp(34px,8vw,64px);line-height:1.05;letter-spacing:.02em;text-shadow:0 2px 30px #0008}
.hero h1 em{display:block;font-size:.4em;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-style:normal;margin-bottom:8px}
.hero p.lead{max-width:34ch;text-align:center;margin:10px 18px;color:#f3e3c8;font-size:17px;opacity:.92}
.ringwrap{width:min(96vw,720px);aspect-ratio:1;position:relative;margin-top:-4px}
svg{display:block;max-width:100%}
.ring{transform-origin:300px 300px;animation:spin 240s linear infinite}
.ringwrap:hover .ring,.ringwrap:hover .flag{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.flag{transform-box:fill-box;transform-origin:center;animation:unspin 240s linear infinite;cursor:pointer}
@keyframes unspin{to{transform:rotate(-360deg)}}
.flag g.fl{transition:transform .4s ease}
.flag:hover g.fl,.flag:focus g.fl{transform:scale(1.35)}
.flag text{font-family:var(--serif);font-size:12px;fill:#f6ecd7;letter-spacing:.06em;paint-order:stroke;stroke:#1b1230;stroke-width:3px}
.wave{animation:wave 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes wave{50%{transform:skewY(5deg) scaleX(.94)}}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 14px 40px}
.btn{font-family:var(--sans);background:var(--gold);color:#2a1a14;border:0;border-radius:99px;padding:12px 22px;font-size:15px;text-decoration:none;display:inline-block;letter-spacing:.02em;transition:transform .25s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:#ffffff14;color:var(--paper);border:1px solid #ffffff44}
.hint{font-family:var(--sans);font-size:12px;letter-spacing:.15em;text-transform:uppercase;opacity:.7;text-align:center;margin:0 0 6px}
/* generic blocks */
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
.light{background:var(--stone);color:var(--ink)}
.light a{color:var(--red)}
h2{font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.1;margin:0 0 .4em}
h3{font-weight:400;font-size:24px;margin:1.4em 0 .3em}
.eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
.light .eyebrow{color:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:18px 0}
.tile{position:relative;border:0;text-align:left;border-radius:16px;padding:14px;min-height:120px;background:#ffffff0f;border:1px solid #ffffff20;overflow:hidden;color:inherit;text-decoration:none;display:block;transition:transform .3s,background .3s}
.light .tile{background:#fffaf0;border-color:#0002}
.tile:hover{transform:translateY(-4px)}
.tile b{display:block;font-weight:400;font-size:20px}
.tile small{font-family:var(--sans);opacity:.7;font-size:12px}
.stripe{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:10px}
.stripe i{flex:1}
.badge{font-family:var(--sans);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:#c9972b33;color:var(--gold);border:1px dashed var(--gold);vertical-align:middle;white-space:nowrap}
.light .badge{color:#7a5410;background:#c9972b22;border-color:#7a5410}
.fonte{font-family:var(--sans);font-size:12px;opacity:.85;white-space:nowrap}
.fonte a{text-decoration:underline dotted}
blockquote{margin:1em 0;padding:.2em 1em;border-left:3px solid var(--gold);font-style:italic}
footer{background:#120b20;color:#cdbb9a;font-family:var(--sans);font-size:12.5px;padding:28px 18px 40px;text-align:center}
footer a{color:var(--gold)}
nav.tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:58px 14px 10px;background:linear-gradient(#1b1230f2 70%,#1b123000);scrollbar-width:none}
nav.tabs a{flex:none;font-family:var(--sans);font-size:13px;text-decoration:none;color:var(--paper);border:1px solid #ffffff33;border-radius:99px;padding:6px 14px}
nav.tabs a.on{background:var(--gold);color:#2a1a14;border-color:var(--gold)}
/* contrada world */
.world{min-height:70vh;padding-bottom:60px;position:relative}
.world .top{padding:90px 18px 30px;text-align:center;position:relative;overflow:hidden}
.world .top h2{font-size:clamp(40px,11vw,84px);letter-spacing:.02em;margin:10px 0 0}
.world .emblem{width:min(56vw,240px);margin:0 auto;filter:drop-shadow(0 12px 24px #0006)}
.stat{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.stat div{text-align:center;font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.stat b{display:block;font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:0;color:var(--gold)}
.chars{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px}
.char{flex:none;width:168px;scroll-snap-align:start;border-radius:18px;padding:14px;background:#ffffff10;border:1px solid #ffffff25;text-decoration:none;color:inherit;transition:transform .3s}
.char:hover{transform:translateY(-4px)}
.char .vs{font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.arc{height:60px}
/* bars */
.bars{display:flex;flex-direction:column;gap:7px;margin:14px 0}
.barrow{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-family:var(--sans);font-size:13px;cursor:pointer;background:none;border:0;text-align:left;color:inherit;padding:2px 0}
.barrow .tr{height:20px;background:#0001;border-radius:10px;overflow:hidden}
.light .barrow .tr{background:#0001}
.barrow .fill{height:100%;border-radius:10px;transition:width .8s cubic-bezier(.2,.8,.2,1);display:flex}
.barrow .fill i{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-family:var(--sans);font-size:12.5px;border:1px solid #0003;background:#fff8;border-radius:99px;padding:5px 12px;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper)}
/* web */
.webwrap{background:radial-gradient(circle at 50% 40%,#2d1a4a,#1b1230 70%);padding:0 0 30px}
.webwrap svg{margin:0 auto;width:min(100%,640px)}
.edge{stroke:#e0703f;stroke-width:3;opacity:.7;cursor:pointer;transition:all .3s}
.edge:hover,.edge.hl{opacity:1;stroke-width:4;stroke:#ff8a5c}
.edge.dim{opacity:.1}
.node{cursor:pointer}
.node text{font-family:var(--sans);font-size:12px;fill:#f6ecd7;paint-order:stroke;stroke:#1b1230;stroke-width:3px}
.episodes{list-style:none;padding:0;margin:20px 0;position:relative}
.episodes:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gold),var(--ember))}
.episodes li{position:relative;padding:0 0 22px 36px}
.episodes li:before{content:"";position:absolute;left:2px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--night);border:3px solid var(--gold)}
.episodes .when{font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.episodes .ep{font-size:17px}
/* oggi, quiz */
.card{border-radius:22px;padding:26px 22px;background:linear-gradient(160deg,#fff8e8,#ecdcb8);color:var(--ink);box-shadow:0 20px 50px #0005}
.quiz .opts{display:grid;gap:10px;margin:16px 0}
.quiz .opts button{text-align:left;border:1px solid #0003;background:#fffaf0;border-radius:14px;padding:14px 16px;font-size:17px;color:var(--ink);transition:transform .2s,background .2s}
.quiz .opts button:hover{transform:translateX(4px);background:#fff}
.prog{height:4px;background:#0002;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--red);transition:width .5s}
.scene{position:fixed;inset:0;z-index:-1;background:var(--night)}
@media (min-width:820px){body{font-size:19px}.tiles{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.barrow{grid-template-columns:130px 1fr 54px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script src="assets/palio-meta.js"></script>
<script>
"use strict";
/* ============ DATA ============ */
const SRC="https://www.ilpalio.org/";
const fonte=(file,label)=>`<span class="fonte">Fonte: <a href="${SRC}${file}" target="_blank" rel="noopener">${label||file}</a></span>`;
const DV='<span class="badge" title="Informazione di pubblico dominio, da controllare">da verificare</span>';

/* Palii vinti: SOLO da vinti.htm  [1600,1700,1800,1900,2000,totale] */
const C=[
 {id:"aquila",n:"Aquila",w:[0,7,6,11,1,25],col:["#f2c230","#1a1a1a","#2a5db0"],em:"aquila",vit:"vittoriecontradeaquila.htm"},
 {id:"bruco",n:"Bruco",w:[2,7,16,5,3,33],col:["#2f8f4e","#f2c230","#2a5db0"],em:"bruco",vit:"vittoriecontradebruco.htm"},
 {id:"chiocciola",n:"Chiocciola",w:[2,19,14,14,0,49],col:["#c0302c","#f2c230","#2a5db0"],em:"chiocciola",vit:"vittoriecontradechiocciola.htm"},
 {id:"civetta",n:"Civetta",w:[1,7,15,8,2,33],col:["#1a1a1a","#c0302c","#f6ecd7"],em:"civetta",vit:"vittoriecontradecivetta.htm"},
 {id:"drago",n:"Drago",w:[2,8,9,16,4,39],col:["#c0302c","#2f8f4e","#f2c230"],em:"drago",vit:"vittoriecontradedrago.htm"},
 {id:"giraffa",n:"Giraffa",w:[2,5,9,15,4,35],col:["#f6ecd7","#c0302c"],em:"giraffa",vit:"vittoriecontradegiraffa.htm"},
 {id:"istrice",n:"Istrice",w:[1,10,15,9,3,38],col:["#f6ecd7","#c0302c","#1a1a1a","#2a5db0"],em:"istrice",vit:"vittoriecontradeistrice.htm"},
 {id:"leocorno",n:"Leocorno",w:[1,3,11,10,4,29],col:["#f6ecd7","#f08a24","#4a9bd6"],em:"leocorno",vit:"vittoriecontradeleocorno.htm"},
 {id:"lupa",n:"Lupa",w:[1,11,11,11,4,38],col:["#f6ecd7","#1a1a1a","#f08a24"],em:"lupa",vit:"vittoriecontradelupa.htm"},
 {id:"nicchio",n:"Nicchio",w:[8,10,11,16,1,46],col:["#2a5db0","#f2c230","#c0302c"],em:"nicchio",vit:"vittoriecontradenicchio.htm"},
 {id:"oca",n:"Oca",w:[6,14,20,20,5,65],col:["#f6ecd7","#2f8f4e","#c0302c"],em:"oca",vit:"vittoriecontradeoca.htm"},
 {id:"onda",n:"Onda",w:[7,9.5,14,11,4,45.5],col:["#f6ecd7","#4a9bd6"],em:"onda",vit:"vittoriecontradeonda.htm"},
 {id:"pantera",n:"Pantera",w:[2,6,7,9,1,25],col:["#c0302c","#2a5db0","#f6ecd7"],em:"pantera",vit:"vittoriecontradepantera.htm"},
 {id:"selva",n:"Selva",w:[2,11,6,14,7,40],col:["#2f8f4e","#f08a24","#f6ecd7"],em:"selva",vit:"vittoriecontradeselva.htm"},
 {id:"tartuca",n:"Tartuca",w:[2,11.5,17,12,5,47.5],col:["#f2c230","#4a9bd6"],em:"tartuca",vit:"vittoriecontradetartuca.htm"},
 {id:"torre",n:"Torre",w:[3,12,20,5,2,42],col:["#c0302c","#f6ecd7","#2a5db0"],em:"torre",vit:"vittoriecontradetorre.htm"},
 {id:"valdimontone",n:"Valdimontone",w:[1,16,10,15,2,44],col:["#f6ecd7","#c0302c","#f2c230"],em:"montone",vit:"vittoriecontradevaldimontone.htm"},
];
/* colours: from the archive's arms page (araldica.htm) via palio-meta.js when available */
if(window.PALIO_META)C.forEach(c=>{const m=PALIO_META.c[c.id];if(m)c.col=m.c.filter((x,i,a)=>a.indexOf(x)===i)});
const byId=Object.fromEntries(C.map(c=>[c.id,c]));
const ERA=["1600","1700","1800","1900","2000"];

/* Rivalità: i file esistono nell'indice rivali.htm. Episodi: parafrasi dal testo di Filiani–Zaffaroni (ilpalio.org). */
const R=[
 {k:"aqupan",a:"aquila",b:"pantera",since:"1947",
  t:["Da alleate a nemiche","Quando l'alleanza si ruppe"],
  intro:"Molti credono che la loro inimicizia sia antichissima. L'archivio dice il contrario: è tra le più giovani, nata ufficialmente nel 1947, dopo due secoli di amicizia.",
  ep:[["1730","L'accordo della questua","Dopo che l'Aquila torna a esistere, la Pantera ottiene di poter mandare il suo «accattano» a chiedere la questua in Piazza Postierla, a patto di rinnovare il patto ogni tre anni. Da quel patto nasce un'alleanza, rinnovata nel 1788."],
   ["16 agosto 1936","Il grigio che cade","La Pantera è favorita con il portentoso Ruello, montato da Meloncino. L'Aquila ha la vecchia Rondinella, affidata a Ganascia. Tra i due fantini c'è del rancore: nel 1933 Ganascia aveva nerbato violentemente il padre di Meloncino, Picino. Al canape cala, Ruello cade, Meloncino resta in ospedale con sessanta giorni di prognosi. Il seme è gettato."],
   ["Agosto 1946","L'ordine del Capitano","Il Capitano panterino Nello Brogi ordina al suo fantino Ranco «una solenne nerbatura dell'Aquila». Ranco obbedisce, e colpisce Ruscetto, che monta Ilary per l'Aquila. L'alleanza resiste, ma ormai solo di nome."],
   ["12 settembre 1947","L'altoparlante","Festa titolare dell'Aquila. I panterini sono lì, ospiti, a rendere omaggio all'alleata. Da un altoparlante qualcuno comincia a insultare la Pantera con riferimenti al 1936. Le bandiere panterine vengono tolte dall'oratorio; pare volino anche manate in un luogo sacro."],
   ["22 dicembre 1947","La rottura","L'assemblea della Pantera, a larghissima maggioranza, interrompe la secolare alleanza. Comincia una delle rivalità più sentite."]]},
 {k:"chitar",a:"chiocciola",b:"tartuca",since:"sec. XVII",
  t:["Le sorelle che si riappacificano"],
  intro:"Una delle rivalità più antiche e radicate, con una particolarità: è stata interrotta e ripresa più volte. Le riappacificazioni sono la parte più interessante.",
  ep:[["Luglio 1686","Il tumulto della tratta","Il Palio viene posticipato al 28 e vince la Giraffa. Durante la tratta esplode un tumulto tra Chiocciola e Tartuca: bastonate e colpi proibiti. Le autorità pensano di escluderle dalla carriera, poi il Governatore ritira l'ordinanza, a patto che non entrino in piazza con la comparsa armata."],
   ["13 giugno 1689","Sant'Antonio, insieme","Appena tre anni dopo, le due contrade onorano insieme Sant'Antonio da Padova, patrono della Tartuca."],
   ["Agosto 1701","Un Te Deum a quattro","La Chiocciola vince con Giuseppone, la Tartuca è seconda. Le due comparse, con i Capitani e l'alleata Torre, vanno insieme nella chiesa dell'Oca a cantare il Te Deum."]]},
 {k:"civleo",a:"civetta",b:"leocorno",since:"1960",
  t:["La più giovane"],
  intro:"È la più recente: nata ufficialmente nel 1960, tra dissidi di confine, sfottò e un Palio vinto in modo schiacciante.",
  ep:[["Settembre 1954","«Barbagianni»","Dopo uno straordinario vinto dal Leocorno, negli stornelli dei vincitori la Civetta viene ridotta a «barbagianni»."],
   ["4 settembre 1960","Il sorriso di Ciancone","Palio straordinario. La Civetta con Ciancone e Uberta de Mores è così superiore che il Palio è deciso già al primo San Martino. Ciancone arriva sorridente; secondo, molto staccato, il Leocorno con Tristezza su Capriola."],
   ["1960","La risposta","I civettini, esaltati, rispondono agli sfottò di anni prima; circolano cartelli che irridono pesantemente l'insegna della Contrada di Pantaneto. È l'inizio ufficiale della rivalità."]]},
 {k:"istlup",a:"istrice",b:"lupa",since:"1929",
  t:["Una bandiera di troppo"],
  intro:"Nel 1928 l'Istrice mandava alla Lupa un saluto affettuoso: «Alla Contrada Alleata e Fedele…». Pochi mesi dopo, tutto cambia per un lembo di territorio.",
  ep:[["14 ottobre 1928","L'ultimo saluto da alleate","Il popolo dell'Istrice scrive alla Lupa, riunita per il banchetto annuale, augurandole la vittoria: «evviva la Lupa!»."],
   ["Luglio 1929","Le bandiere in Via Garibaldi","La Lupa monta per la terza volta Bubbolo, senese e istriciaiolo, segno di rapporti ottimi. Ma nei giorni di Palio i lupaioli appongono le loro bandiere sul lato sinistro di Via Garibaldi, presso il palazzo Ricci Campana. Per gli istriciaioli quelle bandiere devono tornare nella Stufa Secca. Da qui comincia la rottura."]]},
 {k:"nicmon",a:"nicchio",b:"valdimontone",since:"cinquant'anni (secondo la pagina)",
  t:["Pace, vino e bastonate"],
  intro:"Per secoli un rapporto altalenante tra consorelle confinanti, un'alleanza stretta nel 1685 «almeno formalmente»… e tanti malintesi.",
  ep:[["Settembre 1685","Un'alleanza destinata a durare","Nicchio e Montone stringono un'alleanza che durerà, sulla carta, per secoli. Ma tra le due non correva buon sangue."],
   ["1786","L'ariete che dava vino","Per l'inaugurazione di Palazzo Bianchi, il Cavalier Bianchi, maggiorente del Montone, fa costruire un ariete di legno da cui sgorga vino. I nicchiaioli bevono e sbandierano insieme ai montonaioli."],
   ["Luglio 1791","Cinque anni dopo","Il Nicchio vince con il fantino Ciocio nonostante l'ostacolo di Annibale nel Montone, che rientra in pista per fermarlo. Gli organizzatori annunciano che il Montone pagherebbe il Palio al Nicchio, se fosse riuscito a impedirne la vittoria."]]},
 
 {k:"brugir",a:"bruco",b:"giraffa",since:"1945",t:["Il grazie che non bastò"],
  intro:"«Non esiste nulla di scritto per inquadrare l'inizio della rivalità fra Bruco e Giraffa.» Di certo, dice l'archivio, le due consorelle confinanti restarono in ottimi rapporti almeno fino al 1945.",
  ep:[["2 luglio 1912","Un ringraziamento, e una richiesta","Il Bruco vince con Nappa e Farfalla e ringrazia la Giraffa «per l'aiuto sincero e valido». La Giraffa risponde con piacere, ma ricorda che un giorno il Bruco vorrà «renderci il favore»."],
   ["Agosto 1923","La festa insieme","La Giraffa vince con Randellone e Lola; molti brucaioli aiutano ad allestire la memorabile Festa della Vittoria."],
   ["2 luglio 1945","L'assedio della stalla","La Giraffa, favorita, è seconda con Tripolino su Folco. Dopo la corsa Tripolino viene colpito da alcuni del Bruco, e una massa di brucaioli assedia la stalla della Giraffa. Il Priore, che abita proprio sopra, scrive per protestare."],
   ["22 settembre 1946","«Evviva la Giraffa! Evviva il Bruco!»","Dopo la vittoria giraffina del 16 agosto con Ciancone su Piero, il Bruco manda calorose congratulazioni. «Ma ormai qualcosa si era rotto.»"]]},

 {k:"brunic",a:"bruco",b:"nicchio",since:"fine Ottocento",t:["Due schieramenti"],
  intro:"Breve e poco nota, figlia della rete di rapporti nata dagli scontri fra Nicchio e Torre: dopo il 1882 il Nicchio si avvicina all'Oca, e al Bruco non piace.",
  ep:[["Agosto 1898","Al canape","Il Bruco, d'accordo con la Torre, ferma l'Oca al canape. Si formano due schieramenti: Nicchio e Oca contro Bruco e Torre."],
   ["16 agosto 1928","L'ultimo Casato","Il Nicchio, inchiodato alla mossa dalla Chiocciola, rimonta e supera all'ultimo Casato la Torre e il Bruco, che era primo e «inaspettatamente allarga». Il racconto è nel Numero Unico del Nicchio «Momenti di Gloria» (1984)."]]},

 {k:"dralup",a:"drago",b:"lupa",since:"1950",t:["Dalla Piccola Quadruplice all'astio"],
  intro:"Un'altra rivalità nata fra due ex alleate: Drago e Lupa erano il cuore della «Piccola Quadruplice» con Aquila e Valdimontone, alla fine degli anni Trenta.",
  ep:[["Anni Trenta","Tripoli, il fantino condiviso","Fulcro dell'alleanza è l'umbro Tripoli Torrini, che Drago e Lupa si scambiano a piacimento. Drago e Lupa vincono due volte a testa, l'Aquila una."],
   ["Luglio 1950","Il favore restituito","La Lupa, con Ranco su Salomè, parte seconda dietro l'Onda e ferma la rimonta fortissima del Drago, con gli esordienti Rompighiaccio e Niduzza. Il Drago arriva secondo, staccato di pochissimo. Comincia l'astio."],
   ["Agosto 1950","Il Terribile","Ancora la Lupa addosso al Drago: Ivan Magnani detto «Il Terribile» ostacola alla mossa la Contrada di Camporegio. Amaranto e Salomè, racconta la pagina, «partirono attardati e conclusero la loro corsa con una caduta al primo Casato», nel mezzo di una rimonta clamorosa."],
   ["1964","«Alla Lupa ottava»","L'ultimo accenno si trova in un sonetto del Numero Unico del Drago, «Il filo di Arianna»."]]},

 
 {k:"nicoca",a:"nicchio",b:"oca",since:"16 agosto 1934",t:["La fine del T.O.N.O."],
  intro:"Tartuca, Oca, Nicchio e Onda: il T.O.N.O., l'alleanza dominatrice degli anni Trenta. Finì in una sola sera, il 16 agosto 1934.",
  ep:[["1928–1934","Il dominio","Nel 1928 i tre drappelloni vanno a Oca, Nicchio e Onda. Dal 1930 al 1934 il T.O.N.O. lascia alle altre «le briciole»; nel 1933 la Tartuca fa il cappotto con Ganascia e Folco."],
   ["16 agosto 1934","Lampino e Pietrino","Si punta sull'Oca, con Meloncino su Wally. Al Nicchio tocca Lampino, «considerato una brenna», e monta Pietrino, che comincia a crederci. Ma la dirigenza ha un'altra strategia: Pietrino, primo, lascia passare Meloncino e frena perfino la rimonta dell'Aquila. Vince l'Oca."],
   ["Quella sera","Gli abiti sui lampioni","Nei Pispini la gente è infuriata: gli abiti di Pietrino vengono stracciati e appesi ai pali dell'illuminazione. Nasce uno stornello: «Quella del '34, ci s'è legata al dito…». Il Nicchio rompe l'alleanza con l'Oca, e il T.O.N.O. si sfalda."]]},

 {k:"nictor",a:"nicchio",b:"torre",since:"1882",t:["Breve, ma molto violenta"],
  intro:"Un'inimicizia nata per questioni di Palio e diventata, dice l'archivio, una sorta di guerra fra bande: nelle cronache comparivano sempre gli stessi nomi.",
  ep:[["16 agosto 1882","Martello","Nelle prime prove la Torre monta Martello, poi lo smonta platealmente. Il Nicchio, rimasto senza fantino, lo prende convinto che non sia più legato alla Torre. In corsa Martello favorisce la vittoria della Torre con il Moro; nel dopo corsa, bastoni e sassaiola."],
   ["Agosto 1885","Il Ponte di Romana","Una vera battaglia a sassate, poi un corpo a corpo in cui resta vittima il nicchiaiolo De Rossi. Gli scontri proseguono in Piazza del Campo, con molti arresti."],
   ["1886","«Viva la Spannocchia»","La sera della festa titolare un gruppo di nicchiaioli va in Salicotto e prende a sassate le finestre; gli abitanti si barricano in casa. Un'incursione notturna, più tardi, fallisce: una donna della Torre aveva avvisato in tempo."],
   ["Agosto 1892","Dalla parte dell'Oca","Il Nicchio, con Pirrino, favorisce in modo netto la vittoria dell'Oca con Tabarre."]]},

 {k:"ocator",a:"oca",b:"torre",since:"sec. XVII",
  t:["L'unica tra contrade non confinanti"],
  intro:"Forse l'inimicizia più sentita di Siena, e di sicuro la più anomala: è l'unica fra due contrade che non si toccano. Le sue origini, dice l'archivio, sono confuse e scarne, tramandate quasi solo a voce.",
  ep:[["Le origini","Salumi e pescheria","Un'ipotesi: interessi economici. Nella Torre si producevano ottimi salumi, e anche in Fontebranda; e c'era la naturale contrapposizione fra i macelli di Fontebranda e la pescheria in Salicotto."],
   ["26 luglio 1671","La rissa per il baldacchino","Per l'insediamento dell'Arcivescovo Clelio Piccolomini, una grande processione termina al Duomo. All'ingresso, Oca e Torre si affrontano a bastonate per aggiudicarsi il prezioso baldacchino."],
   ["2 luglio 1694","All'ultimo sangue","Le due contrade lottano per la vittoria. La spunta l'Oca con Pelliccino, tra frustate, colpi proibiti e tumulti nel dopo corsa."],
   ["Luglio 1744","In mezzo alla piazza","Il fantino dell'Oca, Ministro, scavalla il torraiolo Cerrino, scaraventandolo, pare, addirittura al centro della piazza."],
   ["1747","Due Palii e una festa","A luglio la Torre, con il miglior cavallo e Bechino, viene fermata dalla Pantera e vince l'Oca. Per tradizione toccherebbe all'Oca organizzare il Palio d'agosto: la Torre la anticipa, con la corsa e una sontuosa festa per tutta la città."],
   ["Luglio 1809","Riesplode","L'Oca è favorita con il miglior cavallo e Piaccina, ultraquarantenne. Alla mossa il fantino della Torre lo trattiene con vigore, impedendogli di partire, e l'inimicizia riesplode in tutta la sua violenza."]]},
 {k:"ondtor",a:"onda",b:"torre",since:"sec. XVII",
  t:["Antica e recente, sentita e snobbata"],
  intro:"«E' antica ma anche recente, è dinamica ed al contempo statica, è sentita da una parte e quasi snobbata dall'altra»: con l'Onda, la Torre è l'unica contrada ad avere due avversarie.",
  ep:[["1622 e 1641","La frontiera del Mercato","Scontri accesi, probabilmente per i confini su Piazza del Mercato. Poi alcuni ondaioli sottraggono alla Torre un tamburo d'ottone, di cui la Torre chiede invano la restituzione."],
   ["Luglio 1688","L'alabarda","Vince l'Istrice con Monco. Durante la corsa il fantino della Torre trattiene quello dell'Onda fino al Casato, dove un alfiere di Salicotto afferra le redini del cavallo rivale. Dopo il Palio un ondaiolo colpisce con un'alabarda l'alfiere della Torre, che muore. Comincia una faida: sfratti e licenziamenti, da una parte e dall'altra."],
   ["26 luglio 1713","La festa titolare","A una serata danzante nasce un diverbio tra il cappellaio ondaiolo Santi Pierucci e il torraiolo Orazio Mannotti, che è capitano. Quella notte, in Via San Salvadore, Mannotti viene ucciso; l'omicida fugge a Napoli."],
   ["10 agosto 1713","Il tamburo restituito","Davanti al notaio, l'accordo: l'Onda restituisce il tamburo d'ottone, affidato al Castellano della Fortezza come giudice imparziale. Sbandierate, fuochi e un convivio in Piazza del Campo."],
   ["Luglio 1811","Due giri o tre?","Vince la Torre con Pettiere. L'Onda, seconda con il famoso Caino, sostiene che Pettiere abbia fatto solo due giri. Tumulto; entrambi i popoli vanno in Provenzano per il Te Deum. La tregua del 1713 era stata effimera."]]},

 
 {k:"pansel",a:"pantera",b:"selva",since:"1786",t:["Una chiesa contesa"],
  intro:"Poco documentata ma molto vissuta, tramandata dalla tradizione orale: nacque probabilmente per questioni di confine, e poi di chiese.",
  ep:[["4 ottobre 1745","La Grifa","Palio straordinario per l'assunzione al trono imperiale di Francesco II. Vince la Pantera con Musino, aiutata da un'accesa contradaiola di Stalloreggi, la Grifa, che entra in pista e colpisce con un bastone il cavallo della Selva, in testa. La Grifa finisce in carcere."],
   ["1786","La Chiesa dei Tessitori","La Pantera deve lasciare la Cappella di San Giovanni Decollato. Le autorità la mandano nella Chiesa dei Tessitori, sede della Selva dal 1778 ma nel territorio panterino; la Selva va a San Desiderio. L'alleanza si rompe."],
   ["1813","Il magazzino","La Pantera lascia volontariamente i Tessitori per San Quirico. Ma la chiesa non torna alla Selva: viene sconsacrata e diventa un magazzino, e la Pantera continua a riscuoterne l'affitto."],
   ["Luglio 1814","Cadere insieme","La Selva con Brandino parte in testa; per fermare il ritorno della Pantera con Pettiere cade trascinando con sé il rivale. Vince il Bruco con Piaccina."]]},

function lum(h){const n=parseInt(h.slice(1),16);return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255}

/* Il Campo a conchiglia: spicchi + Torre del Mangia */
function campo(){
  let sl="";
  for(let i=0;i<9;i++){const a0=(-60+i*15)*Math.PI/180, a1=(-60+(i+1)*15)*Math.PI/180;
    const r=96; sl+=`<path d="M300 468 L${300+r*Math.sin(a0)*1.55} ${468-r*Math.cos(a0)*1.05} L${300+r*Math.sin(a1)*1.55} ${468-r*Math.cos(a1)*1.05}Z" fill="${i%2?'#b88f5a':'#a67c49'}" opacity=".55"/>`;}
  return `<g transform="translate(0,-130)">
    <path d="M150 420 C150 300 450 300 450 420 C450 500 150 500 150 420Z" fill="#8c5a3a" opacity=".5"/>
    <path d="M168 430 C170 330 430 330 432 430 C434 480 166 480 168 430Z" fill="#c69a6a" opacity=".75"/>
    ${sl}
  </g>`;
}
function ringSVG(){
  const cx=300,cy=300,R=235;
  let g="";
  C.forEach((c,i)=>{
    const a=(i/17)*Math.PI*2-Math.PI/2, x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
    g+=`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><g class="flag" tabindex="0" role="link" aria-label="${c.n}" data-go="#/c/${c.id}" style="animation-delay:0s"><g class="fl"><g transform="scale(.46)">${emblem(c,i)}</g><text x="0" y="46" text-anchor="middle">${c.n.toUpperCase()}</text></g></g></g>`;
  });
  return `<svg viewBox="0 0 600 600" role="img" aria-label="Il Campo con le 17 contrade">
   <defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb35c" stop-opacity=".55"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient></defs>
   <circle cx="300" cy="300" r="290" fill="url(#glow)"/>
   <circle cx="300" cy="300" r="235" fill="none" stroke="#c9972b" stroke-opacity=".25" stroke-dasharray="2 8"/>
   <g transform="translate(300,300) scale(.78) translate(-300,-300)">${campoFull()}</g>
   <g class="ring">${g}</g>
  </svg>`;
}
function campoFull(){
  /* piazza a conchiglia vista dall'alto: ventaglio di 9 spicchi, bordo di palazzi, Torre del Mangia in alto */
  let s="";
  for(let i=0;i<9;i++){
    const a0=(-80+i*20)*Math.PI/180,a1=(-80+(i+1)*20)*Math.PI/180;
    const x0=300+200*Math.sin(a0),y0=360-200*Math.cos(a0)*0.95,x1=300+200*Math.sin(a1),y1=360-200*Math.cos(a1)*0.95;
    s+=`<path d="M300 420 L${x0.toFixed(1)} ${y0.toFixed(1)} L${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${i%2?'#d8b07a':'#c99a60'}"/>`;
  }
  return `<ellipse cx="300" cy="372" rx="215" ry="168" fill="#6d3f2c"/>
   <path d="M95 390 Q300 130 505 390 Q300 520 95 390Z" fill="#b5794c"/>
   <g>${s}</g>
   <path d="M95 390 Q300 130 505 390" fill="none" stroke="#f1c27a" stroke-width="3" opacity=".7"/>
   <!-- Palazzo Pubblico e Torre del Mangia -->
   <rect x="238" y="338" width="124" height="46" fill="#9b4a35"/><rect x="238" y="330" width="124" height="8" fill="#7d3a29"/>
   <g fill="#fff2d6" opacity=".55"><rect x="250" y="350" width="6" height="14"/><rect x="266" y="350" width="6" height="14"/><rect x="282" y="350" width="6" height="14"/><rect x="312" y="350" width="6" height="14"/><rect x="328" y="350" width="6" height="14"/><rect x="344" y="350" width="6" height="14"/></g>
   <rect x="291" y="168" width="18" height="170" fill="#8e3f2d"/>
   <rect x="284" y="150" width="32" height="24" fill="#a64d38"/><path d="M280 150 H320 V140 H312 V146 H304 V140 H296 V146 H288 V140 H280Z" fill="#a64d38"/>
   <circle cx="300" cy="134" r="12" fill="#f4e6c6"/><path d="M296 144 H304 L300 112Z" fill="#8e3f2d"/>
   <circle cx="300" cy="104" r="3" fill="#fff0c0"/>`;
}

function rivalry(key){
  if(key){const r=R.find(x=>x.k===key); if(r) return rivalStory(r);}
  const pos={};const cx=300,cy=290,Rr=220;
  C.forEach((c,i)=>{const a=(i/17)*Math.PI*2-Math.PI/2;pos[c.id]=[cx+Rr*Math.cos(a),cy+Rr*Math.sin(a)]});
  const edges=R.map(r=>{const [x1,y1]=pos[r.a],[x2,y2]=pos[r.b];const mx=(x1+x2)/2*.75+cx*.25,my=(y1+y2)/2*.75+cy*.25;
    return `<path class="edge" data-a="${r.a}" data-b="${r.b}" d="M${x1.toFixed(1)} ${y1.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" data-go="#/rivalita/${r.k}"><title>${byId[r.a].n} – ${byId[r.b].n}</title></path>`}).join("");
  const nodes=C.map(c=>{const [x,y]=pos[c.id];const out=x>cx?1:-1;return `<g class="node" data-id="${c.id}" data-go="#/c/${c.id}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle r="11" fill="${c.col[0]}" stroke="${c.col[1]||'#fff'}" stroke-width="3"/><text x="${out*16}" y="4" text-anchor="${out>0?'start':'end'}">${c.n}</text></g>`}).join("");
  const cards=R.map(r=>`<a class="char" style="width:auto;flex:1 1 220px;border-left:4px solid ${byId[r.a].col[0]};border-right:4px solid ${byId[r.b].col[0]}" href="#/rivalita/${r.k}"><div class="vs">${r.ep?t("ep")+" · "+r.since:fonte2()}</div><div style="font-size:20px">${byId[r.a].n} <span style="opacity:.5">×</span> ${byId[r.b].n}</div></a>`).join("");
  return `${navTabs("#/rivalita")}<div class="webwrap" style="padding-top:110px">
    <div class="wrap"><div class="eyebrow">${t("webTitle")}</div><h2>${t("webTitle")}</h2><p>${t("webSub")}</p></div>
    <svg viewBox="0 0 600 580" id="web">${edges}${nodes}</svg>
    <div class="wrap"><div class="chars" style="flex-wrap:wrap;overflow:visible">${cards}</div>
    <p>${fonte("rivali.htm","rivali.htm")}</p></div></div>`;
}

function render(){

  else if(p[1]==="oggi") html=oggi();
  else if(p[1]==="quiz"){html=quiz();qs={i:-1,score:{}};after=drawQuiz;}
  else html=home();
  main.innerHTML=`<section class="page on">${html}</section>`;
  window.scrollTo(0,0);
  if(after)after();
  $("#f1").textContent=t("footer");
  document.title=t("title");
}

});

function setLang(l){lang=l;try{localStorage.setItem("lang",l)}catch(e){}document.documentElement.lang=l;$("#bIt").classList.toggle("on",l==="it");$("#bEn").classList.toggle("on",l==="en");render();}
$("#bIt").onclick=()=>setLang("it");$("#bEn").onclick=()=>setLang("en");
setLang(lang);
</script>
</body>
</html>
